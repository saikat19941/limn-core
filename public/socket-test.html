<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LIMN CORE SOCKET TEST</title>

    <style>

        body {
            font-family: Arial;
            background: #111;
            color: #fff;
            padding: 20px;
        }

        h1 {
            color: lime;
        }

        .event {
            background: #222;
            padding: 10px;
            margin-top: 10px;
            border-left: 5px solid lime;
        }

    </style>

</head>

<body>

    <h1>Realtime Socket Events</h1>

    <div id="events"></div>


    <!-- Socket.IO Client -->
    <script src="/socket.io/socket.io.js"></script>

    <script>

        const socket = io();


        const eventsDiv = document.getElementById("events");


        // Add Event To UI
        function addEvent(type, data) {

            const div = document.createElement("div");

            div.classList.add("event");

            div.innerHTML = `
                <h3>${type}</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;

            eventsDiv.prepend(div);

        }


        // Connected
        socket.on("connect", () => {

            console.log("SOCKET CONNECTED");

            addEvent("SOCKET CONNECTED", {
                socketId: socket.id
            });

        });

        socket.onAny((event, data) => {

            console.log("EVENT RECEIVED:", event, data);

        });


        // Insert Event
        socket.on("row_inserted", (data) => {

            addEvent("ROW INSERTED", data);

        });


        // Update Event
        socket.on("row_updated", (data) => {

            addEvent("ROW UPDATED", data);

        });


        // Delete Event
        socket.on("row_deleted", (data) => {

            addEvent("ROW DELETED", data);

        });

    </script>

</body>

</html>
